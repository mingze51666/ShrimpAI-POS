$prefix: orderAttribute
title: 顾客设定
description: 内用、外带等帮助分析的资讯
_title:
  $prefix: title
  create: 新增顾客设定
  update: 编辑顾客设定
  reorder: 排序顾客设定
emptyBody: |-
  顾客设定可以帮助我们统计哪些人来消费，例如：
  20-30岁、外带、上班族。
headerInfo: 顾客设定
tutorial:
  title: 建立属于你的顾客设定
  content: |-
    这里是用来设定顾客的资讯，例如：内用、外带、上班族等。
    这些资讯可以帮助我们统计哪些人来消费，进而做出更好的经营策略。
  createExample: 帮助建立一份范例以供测试。
example:
  age: 年龄
  _age:
    $prefix: age
    child: 小孩
    adult: 成人
    senior: 长者
  place: 位置
  _place:
    $prefix: place
    takeout: 外带
    dineIn: 内用
  ecoFriendly: 环保
  _ecoFriendly:
    $prefix: ecoFriendly
    reusableBottle: 环保杯
    reusableBag: 环保袋
meta:
  mode: 种类：{name}
  default: 预设：{name}
  noDefault: 未设定预设
mode:
  divider: 顾客设定种类
  name:
  - statOnly: 一般
    changePrice: 变价
    changeDiscount: 折扣
  helper:
  - statOnly: 一般的设定，选取时并不会影响点单价格。
    changePrice: |-
      选取设定时，可能会影响价格。
      例如：外送 + 30块钱、环保杯 - 5块钱。
    changeDiscount: |-
      选取设定时，会根据折扣影响总价。
      例如：内用 + 10% 服务费、亲友价 - 10%。
name:
  label: 顾客设定名称
  hint: 例如：顾客年龄
  error:
    repeat: 名称不能重复
option:
  title:
    create: 新增选项
    update: 编辑选项
    reorder: 排序选项
  meta:
    default: 预设
    optionOf: '{name}的选项'
  name:
    label: 选项名称
    helper: |-
      以年龄为例，可能的选项有：
      - ⇣ 20
      - 20 - 30
    error:
      repeat: 名称不能重复
  mode:
    title: 选项模式
    helper:
    - statOnly: 因为本设定为「一般」故无须设定「折价」或「变价」
      changePrice: 订单时选择此项会套用此变价
      changeDiscount: 订单时选择此项会套用此折价
    hint:
    - statOnly: ''
      changePrice: 例如：-30 代表减少三十块
      changeDiscount: 例如：80 代表「八折」
  toDefault:
    label: 设为预设
    helper: |-
      设定此选项为预设值，每个订单预设都会是使用这个选项。
    confirmChange:
      title: 覆盖选项预设？
      content: 这么做会让「{name}」变成非预设值
value:
  empty: 不影响价钱
  free: 免费
