$prefix: cashier
tab: 收银
unitLabel:
- 币值：{unit}
- unit:
counter:
  label:
  - 数量
  - 设定币值数量时的标签
toDefault:
  title: 设为预设
  tutorial:
    title: 收银机预设状态
    content: |-
      在下面设定完收银机各币值的数量后，
      按这里设定预设状态！
      设定好的数量就会是各个币值状态条的「最大值」。
  dialog:
    title: 调整收银台预设？
    content: |-
      这将会把目前的收银机状态设定为预设状态。
      此动作将会覆盖掉先前的设定。
changer:
  title: 换钱
  button: 套用
  tutorial:
    title: 收银机换钱
    content: |-
      一百块换成 10 个十块之类。
      帮助快速调整收银机状态。
  error:
    noSelection: 请选择要套用的组合
    notEnough: "{unit} 元不够换"
    invalidHead: "{count} 个 {unit} 元没办法换"
    invalidBody: "{count} 个 {unit} 元"
  favorite:
    tab: 常用
    hint: 选完后请点选「套用」来使用该组合
    emptyBody: 这里可以帮助你快速转换不同币值
    item:
      from: 用 {count} 个 {unit} 元换
      to: "{count} 个 {unit} 元"
  custom:
    tab: 自订
    addBtn: 新增常用
    count:
      label: 数量
    unit:
      label: 币值
      addBtn: 新增币种
    divider:
      from: 拿
      to: 换
surplus:
  title: 结余
  button: 结余
  tutorial:
    title: 每日结余
    content: |-
      结余可以帮助我们在每天打烊时，
      计算现有金额和预设金额的差异。
  error:
    emptyDefault: 尚未设定预设状态
  tableHint: 若你确认收银机的金钱都没问题之后就可以完成结余啰！
  columnName:
  - unit: 单位
    currentCount: 现有
    diffCount: 差异
    defaultCount: 预设
  counter:
    label: 币值{unit}的数量
    shortLabel: 数量
  currentTotal:
    label: 现有总额
    helper: |-
      现在收银机应该要有的总额。
      若你发现现金和这值对不上，想一想今天有没有用收银机的钱买东西？
  diffTotal:
    label: 差额
    helper: |-
      和收银机最一开始的总额的差额。
      这可以快速帮你了解今天收银机多了多少钱唷。
