$prefix: menu
title: 菜单
subtitle: 产品种类、产品
tutorial:
  title: 建立属于你的菜单
  content: 首先我们来开始建立一份菜单吧！
  createExample: 帮助建立一份范例菜单以供测试。
search:
  hint: 搜寻产品、成分、份量
  prefix:
  - ingredient: '成分：'
    quantity: '份量：'
  notFound: 搜寻不到相关资讯，打错字了吗？
example:
  catalog:
    burger: 汉堡
    drink: 饮品
    side: 点心
    other: 其他
  product:
    cheeseBurger: 起司汉堡
    veggieBurger: 蔬菜汉堡
    hamBurger: 火腿汉堡
    cola: 可乐
    coffee: 咖啡
    fries: 薯条
    straw: 吸管
    plasticBag: 塑胶袋
  ingredient:
    cheese: 起司
    lettuce: 莴苣
    tomato: 番茄
    bun: 面包
    chili: 辣酱
    ham: 火腿
    cola: 可乐
    coffee: 滤挂咖啡包
    fries: 薯条
    straw: 吸管
    plasticBag: 塑胶袋
  quantity:
    small: 少量
    large: 增量
    none: 无
catalog:
  emptyBody: |-
    我们会把相似「产品」放在「产品种类」中，
    到时候点餐会比较方便，例如：
    • 「起司汉堡」、「蔬菜汉堡」整合进「汉堡」
    • 「塑胶袋」、「环保杯」整合进「其他」
  title:
    create: 新增产品种类
    update: 编辑产品种类
    reorder: 排序产品种类
  dialogDeletionContent:
  - =0: 其内无任何产品
    other: 将会一同删除掉 {count} 个产品
  name:
    label: 产品种类名称
    hint: 例如：汉堡
    error:
      repeat: 名称重复了，请改个名字吧！
  emptyProducts: 尚未设定产品
product:
  headerInfo: 产品
  emptyBody: |-
    「产品」是菜单里的基本单位，例如：
    「起司汉堡」、「可乐」
  notSelected:
  - 请先选择产品种类
  title:
    create: 新增产品
    update: 编辑产品
    reorder: 排序产品
    updateImage: 更新照片
  meta:
    title: 产品
    price: 价格：{price}
    cost: 成本：{cost}
    empty: 尚未设定成分
  name:
    label: 产品名称
    hint: 例如：起司汉堡
    error:
      repeat: 产品名称重复
  price:
    label: 产品价格
    helper: 订单页面会呈现的价钱
  cost:
    label: 产品成本
    helper: 用来算出利润，理应小于价钱
  emptyIngredients: 尚未设定成分
ingredient:
  emptyBody: |-
    你可以在产品中设定成分等资讯，例如：
    「起司汉堡」有「起司」、「面包」等成分
  title:
    create: 新增成分
    update: 编辑成分
    reorder: 排序成分
  meta:
    amount: 使用量：{amount}
  search:
    label: 搜寻成分
    helper: 新增成分后，可至「库存」设定相关资讯。
    hint: 例如：起司
    add: 新增成分「{name}」
    error:
      empty: 必须设定成分，请点选以设定。
      repeat: 产品已经有相同的成分了，不能重复选取。
  amount:
    label: 使用量
    helper: 预设的使用量，若餐点可以调整该成分的使用量，请于成分的「份量」中设定。
quantity:
  title:
    create: 新增份量
    update: 编辑
  meta:
    amount: 使用量：{amount}
    additionalPrice: 额外售价：{price}
    additionalCost: 额外成本：{cost}
  search:
    label: 搜寻份量
    helper: 新增成分份量后，可至「份量」设定相关资讯。
    hint: 例如：多量、少量
    add: 新增份量「{name}」
    error:
      empty: 必须设定份量，请点选以设定。
      repeat: 产品已经有相同的份量了，不能重复选取。
  amount:
    label: 使用量
  additionalPrice:
    label: 额外售价
    helper: 设为 0 则代表加量（减量）不加价。
  additionalCost:
    label: 额外成本
    helper: 预额外成本可以为负数，如「少量」会减少成分的使用，相对成本降低。
