$prefix: setting
tab: 设定
version: 版本：{version}
welcome: HI，{name}
logoutBtn: 登出
elf:
  title: 建议
  description: 使用 Google 表单提供回馈
  content: |-
    觉得这里还少了什么吗？
    欢迎[提供建议](https://forms.gle/R1vZDk9ztQLScUdb9)。
    也可以来看看[排程中的功能](https://github.com/evan361425/flutter-pos-system/milestones)。
feature:
  title: 其他设定
  description: 外观、语言、提示
theme:
  title: 调色盘
  name:
  - dark: 暗色模式
    light: 日光模式
    system: 跟随系统
language:
  title: 语言
checkoutWarning:
  title: 收银机提示
  name:
  - showAll: 全部显示
    onlyNotEnough: 仅不够时显示
    hideAll: 全部隐藏
  tip:
  - showAll: |-
      若使用小钱去找，显示提示。
      例如 5 块钱不够了，开始用 5 个 1 块去找钱
    onlyNotEnough: 当零钱不够找的时候，显示提示。
    hideAll: 当点餐时，收银机不会显示任何提示
orderAwakening:
  title: 点餐时不关闭萤幕
  description: 若取消，则会根据系统设定时间关闭萤幕
report:
  title: 收集错误讯息和事件
  description: 当应用程式发生错误时，寄送错误讯息，以帮助应用程式成长
