$prefix: "transit"
title: 资料转移
description: 汇入、汇出店家资讯和订单
_desc:
  $prefix: description
  csv: 用逗号分隔的列表，轻量级的汇出和汇入资料，几乎兼容所有软体。
  excel: Excel 可以离线汇出和汇入，容易与 Google 试算表和 Microsoft Excel 整合。
  googleSheet: Google 试算表是一个强大的小型资料库，汇出之后可以做很多客制化的分析！
  plainText: 快速检查、快速分享。
method:
  title: 请选择欲转移的方式
  name:
  - googleSheet: Google 试算表
    plainText: 纯文字
    excel: Excel 档案
    csv: CSV 档案
catalog:  # 资料的分类
  title:
  - 用 {name} 做什么？
  name:
  - exportOrder: 汇出订单记录
    exportModel: 汇出店家资讯
    importModel: 汇入店家资讯
  helper:
  - exportOrder: 订单资讯可以让你汇出到第三方位置后做更细致的统计分析。
    exportModel: 商家资讯是用来把菜单、库存等资讯备份到第三方位置。
    importModel: 同步资讯到此设备。
model:
  name:
  - menu: 菜单
    stock: 库存
    quantities: 份量
    replenisher: 补货
    orderAttr: 顾客设定
order:
  name:
  - basic: 订单
    attr: 顾客细项
    product: 产品细项
    ingredient: 成分细项
  setting:
    title: 订单汇出设定
    meta:
      overwrite:
      - 'true': 会覆写
        'false': 不会覆写
      titlePrefix:
      - 'true': 有日期前缀
        'false': 无日期前缀
    overwrite:
      label: 是否覆写表单
      hint: 覆写表单之后，将会从第一行开始汇出
    titlePrefix:
      label: 加上日期前缀
      hint: 表单名称前面加上日期前缀，例如：「0101 - 0131 订单资料」
    recommendCombination: 不覆写而改用附加的时候，建议表单名称「不要」加上日期前缀
  meta:
    range: "{range} 的订单"
    rangeDays: "{days} 天的资料"
  capacity:
    title: 预估容量为：{size}
    content: 过高的容量可能会让执行错误，建议分次执行，不要一次汇出太多笔。
    ok: 容量刚好
    warn: 容量警告
    danger: 容量危险
  item:
    meta:
      productCount: 餐点数：{count}
      price: 总价：{price}
    dialog:
      title: 订单细节
export:
  tab: 汇出
  fileDialogTitle: 选择汇出的位置
  basic:
    btn:
      csv: 汇出成 CSV 档
      excel: 汇出成 Excel 档
      googleSheet: 汇出至 Google 试算表
      plainText: 纯文字拷贝
    fileName: POS 系统资料
    success:
      csv: 汇出成功
      excel: 汇出成功
      googleSheet: 上传成功
      plainText: 拷贝成功
      action:
        googleSheet: 开启表单
  order:
    title:
      csv: 汇出成 CSV 档
      excel: 汇出成 Excel 档
      googleSheet: 汇出至 Google 试算表
      plainText: 纯文字拷贝
    subtitle:
      csv: 会有多个档案，每个档案包含不同的资料
      excel: 单一档案内含工作表，每个工作表包含不同的资料
      googleSheet: |
        上传需要网路连线，且请求可能会被 Google 限制。
        若上传失败，请稍后再试或使用其他方式汇出。
      plainText: 适合用来简单的分享或检查资料
    file:
      name: 订单资料
    progress:
      googleSheet:
        overwrite: 资料覆写中
        append: 资料附加进既有资料中
    warning:
      memory:
        googleSheet: |
          这里的容量代表网路传输所消耗的量，实际占用的云端记忆体可能是此值的百分之一而已。
          详细容量限制说明可以参考[本文件](https://developers.google.com/sheets/api/limits#quota)。
    success:
      csv: 汇出成功
      excel: 汇出成功
      googleSheet: 上传成功
      plainText: 拷贝成功
      action:
        googleSheet: 开启表单
import:
  tab: 汇入
  btn:
    csv: 选择 .csv 档
    excel: 选择 .xlsx 档
    googleSheet: 选择 Google 试算表
    plainText:
      action: 点选以贴上文字
      hint: 贴上复制而来的文字
      helper: |
        贴上文字后，会分析文字并决定汇入的是什么种类的资讯。
        复制过大的文字可能会造成系统的崩溃。
  modelSelection:
    label: 资料类型
    all: 全部
    hint: 请先选择资料类型来进行汇入
    plainTextHint: 请先输入文字来进行汇入
  progress:
    googleSheet:
      start: 拉取试算表资料中
      prepare: 取得试算表资讯中
  error:
    basic:
      columnCount: 资料量不足，需要 {columns} 个栏位
      duplicate: 将忽略本行，相同的项目已于前面出现
    csv:
      pickFile: 选择档案失败
    excel:
      pickFile: 选择档案失败
    googleSheet:
      fetchData:
        title: 无法拉取试算表资料
        helper: |-
          别担心，通常都可以简单解决！
          可能的原因有：
          • 网路状况不稳；
          • 尚未授权 POS 系统进行表单的读取；
          • 试算表 ID 打错了，请尝试复制整个网址后贴上；
          • 该试算表被删除了。
      missing:
        title: 找不到表单 {name} 的资料
        helper: |-
          别担心，通常都可以简单解决！
          可能的原因有：
          • 该试算表没有我们想要的表单；
          • 网路状况不稳；
          • 尚未授权 POS 系统进行表单的读取；
          • 试算表 ID 打错了，请尝试复制整个网址后贴上；
          • 该试算表被删除了。
    preview:
      notFound: 找不到「{name}」的资料
    plainText:
      notFound: 这段文字无法匹配相应的服务，请参考汇出时的文字内容。
  success: 汇入成功
  preview:
    confirm:
      title: 确定汇入？
      content: 注意：汇入后将会把没列到的资料移除，请确认是否执行！
      btn: 汇入资料
      verify: 确认资料
      hint:
      - |
        还差 {count} 种资料未确认。
        请确认资料是否正确，若有错误请取消操作并修正后重新汇入。
      - count: {type: int}
    ingredient:
      meta:
        amount: 库存：{amount}
        maxAmount:
        - =0: 未设定
          other: 最大值：{value}
      confirm: 注意：汇入后，为了避免影响「菜单」的状况，并不会把没列出的成分移除。
    quantity:
      confirm: 注意：汇入后，为了避免影响「菜单」的状况，并不会把没列出的份量移除。
  columnStatus:
  - normal: （一般）
    staged: （新增）
    stagedIng: （新的成分）
    stagedQua: （新的份量）
    updated: （异动）
format:
  field:
    product:
      ingredient:
        title: 成分资讯
        note: |-
          产品全部成分的资讯，格式如下：
          - 成分1,预设使用量
            + 份量a,额外使用量,额外价格,额外成本
            + 份量b,额外使用量,额外价格,额外成本
          - 成分2,预设使用量
    replenishment:
      title: 补货量
      note: |-
        每次补货时特定成分的量，格式如下：
        - 成分1,补货量
        - 成分2,补货量
    attributeOption:
      title: 顾客设定选项
      note: |-
        「选项值」会根据顾客设定种类不同而有不同意义，格式如下：
        - 选项1,是否为预设,选项值
        - 选项2,是否为预设,选项值
    order:
      no: 编号
      time: 时间
      price: 总价
      productPrice: 产品总价
      paid: 付额
      cost: 成本
      profit: 收入
      itemCount: 产品份数
      typeCount: 产品类数
    _order:
      $prefix: order
      attribute:
        title: 订单顾客设定
        header:
          no: 编号
          name: 设定类别
          option: 选项
      product:
        title: 订单产品细项
        header:
          no: 编号
          name: 产品
          catalog: 种类
          count: 数量
          price: 单一售价
          cost: 单一成本
          origin: 单一原价
      ingredient:
        title: 订单成分细项
        header:
          no: 编号
          name: 成分
          quantity: 份量
          amount: 数量
      expandable:  # 资料放在不只一个资料表，透过多个资料表来分类
        hint: 详见下栏
  text:
    order:
      price:
      - =0: 共 {price} 元。
        other: 共 {price} 元，其中的 {productsPrice} 元是产品价钱。
      money: 付额 {paid} 元、成分 {cost} 元。
      productCount:
      - =0: 没有任何餐点。
        =1: |-
          餐点有 {count} 份，内容为：
          {products}。
        other: |-
          餐点有 {count} 份（{setCount} 种组合）包括：
          {products}。
      product:
      - =0: '{product}（{catalog}）{count} 份共 {price} 元，没有设定成分'
        other: '{product}（{catalog}）{count} 份共 {price} 元，成份包括 {ingredients}'
      ingredient:
      - =0: "{ingredient}（{quantity}）"
        other: "{ingredient}（{quantity}），使用 {amount} 个"
      noQuantity: 预设份量
      orderAttribute: 顾客的 {options}
      orderAttributeItem: '{name} 为 {option}'
    menu:
      header: 本菜单共有 {catalogs} 个产品种类、{products} 个产品。
      headerPrefix: 本菜单
      catalog: 第{index}个种类叫做 {catalog}，{details}。
      catalogDetails:
      - =0: 没有设定产品
        other: 共有 {count} 个产品
      product: 第{index}个产品叫做 {name}，其售价为 {price} 元，成本为 {cost} 元，{details}
      productDetails:
      - =0: 它没有设定任何成份。
        other: |-
          它的成份有 {count} 种：{names}。
          每份产品预设需要使用 {details}。
      ingredient: '{amount} 个 {name}，{details}'
      ingredientDetails:
      - =0: 无法做份量调整
        other: 它还有 {count} 个不同份量 {quantities}
      quantity: '每份产品改成使用 {amount} 个并调整产品售价 {price} 元和成本 {cost} 元'
    stock:
      header: 本库存共有 {count} 种成分。
      headerPrefix: 本库存
      ingredient: 第{index}个成分叫做 {name}，库存现有 {amount} 个{details}。
      _ingredient:
        $prefix: ingredient
        maxAmount:
        - =0: ''
          other: ，最大量有 {max} 个
        restockPrice:
        - =0: ''
          other: '且每 {quantity} 个成本要价 {price} 元'
    quantities:
      header: 共设定 {count} 种份量。
      headerSuffix: 种份量。
      quantity: 第{index}种份量叫做 {name}，预设会让成分的份量乘以 {prop} 倍。
    replenisher:
      header: 共设定 {count} 种补货方式。
      headerSuffix: 种补货方式。
      replenishment: 第{index}个成分叫做 {name}，{details}。
      replenishmentDetails:
      - =0: '它并不会调整库存'
        other: 它会调整{count}种成份的库存
    oa:  # order attribute
      header: 共设定 {count} 种顾客属性。
      headerSuffix: 种顾客属性。
      oa: 第{index}种属性叫做 {name}，属于 {mode} 类型，{details}。
      oaDetails:
      - =0: 它并没有设定选项
        other: 它有 {count} 个选项
      defaultOption: 预设
      modeValue: 选项的值为 {value}
googleSheet:
  dialog:
    title: 提供 Google 试算表
    create: 建立新的试算表
    selectExist: 选择现有的试算表
    confirm: 确认
    id:
      label: 试算表 ID 或网址
      helper: |-
        试算表的 ID 是网址中的英文、数字、底线和减号的组合。
        例如，"https://docs.google.com/spreadsheets/d/1a2b3c4d5e6f7g8h9i0j" 的 ID 是 "1a2b3c4d5e6f7g8h9i0j"。
        使用现有的试算表将可能覆盖选择的工作表中的数据。
  progress:
    create: 建立试算表
    fulfill: 在试算表中建立表单
  error:
    create:
      title: 无法建立试算表
      helper: |-
        别担心，通常都可以简单解决！
        可能的原因有：
        • 网路状况不稳；
        • 尚未授权 POS 系统进行表单的编辑。
    fulfill:
      title: 无法在试算表中建立表单
      helper: |-
        别担心，通常都可以简单解决！
        可能的原因有：
        • 网路状况不稳；
        • 尚未授权 POS 系统进行表单的建立；
        • 试算表 ID 打错了，请尝试复制整个网址后贴上；
        • 该试算表被删除了。
    id:
      notFound: 找不到试算表
      notFoundHelper: |-
        别担心，通常都可以简单解决！
        可能的原因有：
        • 网路状况不稳；
        • 尚未授权 POS 系统进行表单的读取；
        • 试算表 ID 打错了，请尝试复制整个网址后贴上；
        • 该试算表被删除了。
      empty: ID 不能为空
      invalid: |-
        不合法的 ID，必须包含：
        • /spreadsheets/d/<ID>/
        • 或者直接给 ID（英文+数字+底线+减号的组合）
    network: |-
      网路错误，无法连接到 Google 试算表。
