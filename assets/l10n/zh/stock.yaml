$prefix: stock
tab: 库存
updatedAt: 上次补货时间：{updatedAt}
ingredient:
  emptyBody: 新增成份后，就可以开始追踪这些成份的库存啰！
  title:
    create: 新增成分
    update: 编辑成分
    updateAmount: 编辑库存
  tutorial:
    title: 新增成分
    content: |-
      成份可以帮助我们确认产品的库存。
      你可以在「产品」中设定成分，然后在这里设定库存。
  dialogDeletionContent:
  - =0: 目前无任何产品有本成分
    other: 将会一同删除掉 {count} 个产品的成分
  productsCount: 共有 {count} 个产品使用此成分
  name:
    label: 成分名称
    hint: 例如：起司
    error:
      repeat: 成分名称重复
  amount:
    label: 现有库存
  amountMax:
    label: 最大库存
    helper: |-
      设定这个值可以帮助你一眼看出用了多少成分。
      填空或不填写则每次增加库存，都会自动设定这值，
  restockTitle: |-
    每次补货可以补货多少成分。
    例如，每 30 份起司要价 100 元，「补货单位」就填写 30，「补货单价」就填写 100。

    这可以帮助你透过价钱快速补货。
  restockPrice:
    label: 补货单价
  restockQuantity:
    label: 补货单位
  restockDialog:
    title:
    - 目前每{quantity}个要价{price}元
    subtitle: 请输入购买价格
    quantity:
      tab: 数量
      btn: 使用数量
      label: 现有库存
      helper: 若没有设定最大库存量，增加本值会重设最大库存量。
    price:
      tab: 价格
      btn: 使用价钱
      label: 补货价格
      emptyBody: 赶紧设定单价，让你可以利用补货的金额直接算出补货的量。
      oldAmount: 原始库存
replenishment:
  button: 采购
  emptyBody: 采购可以帮你快速调整成分的库存
  title:
    list: 采购列表
    create: 新增采购
    update: 编辑采购
  meta:
    affect: 会影响 {count} 项成分
  never: 尚未补货过
  apply:
    preview: 预览
    confirm:
      button: 套用
      title: 套用采购？
      column:
      - name: 名称
        amount: 数量
      hint: 选择套用后，将会影响以下成分的库存
  tutorial:
    title: 成份采购
    content: |-
      透过采购，你不再需要一个一个去设定成分的库存。
      马上设定采购，一次调整多个成份吧！
  name:
    label: 采购名称
    hint: 例如：Costco 采购
    error:
      repeat: 采购名称重复
  ingredients:
    divider: 成分
    helper: 点选以设定不同成分欲采购的量
  ingredientAmount:
    hint: 设定增加／减少的量
quantity:
  title: 份量
  description: 半糖、微糖等
  _title:
    $prefix: title
    create: 新增份量
    update: 编辑份量
  emptyBody: |-
    份量可以快速调整成分的量，例如：
    半糖、微糖。
  meta:
    proportion: 预设比例：{proportion}
  dialogDeletionContent:
  - =0: 目前无任何产品成分有本份量
    other: 将会一同删除掉 {count} 个产品成分的份量'
  name:
    label: 份量名称
    hint: 例如：少量或多量
    error:
      repeat: 份量名称重复
  proportion:
    label: 预设比例
    helper: |-
      当产品成分使用此份量时，预设替该成分增加的比例。

      例如：此份量为「多量」预设份量为「1.5」，
      今有一产品「起司汉堡」的成分「起司」，每份汉堡会使用「2」单位的起司，
      当增加此份量时，则会自动替「起司」设定为「3」（2 * 1.5）的份量。

      若设为「1」则无任何影响。

      若设为「0」则代表将不会使用此成分
