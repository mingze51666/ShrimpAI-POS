goals:
  title: 本日总结
  count:
    title: 订单数
    description: |-
      订单数反映了产品对顾客的吸引力。
      它代表了市场对你产品的需求程度，能帮助你了解何种产品或时段最受欢迎。
      高订单数可能意味著你的定价策略或行销活动取得成功，是商业模型有效性的指标之一。
      但要注意，单纯追求高订单数可能会忽略盈利能力。
  revenue:
    title: 营收
    description: |-
      营收代表总销售额，是业务规模的指标。
      高营收可能显示了你的产品受欢迎且销售良好，但营收无法反映出业务的可持续性和盈利能力。
      有时候，为了提高营收，公司可能会采取降价等策略，这可能会对公司的盈利能力造成影响。
  profit:
    title: 净利
    description: |-
      净利是营业收入减去营业成本后的余额，是公司能否持续经营的关键。
      盈利直接反映了营运效率和成本管理能力。
      不同于营收，盈利考虑了生意的开支，包括原料成本、人力、租金等，
      这是一个更实际的指标，能帮助你评估经营是否有效且可持续。
  cost:
    title: 成本
  achievedRate: |-
    利润达成
    {rate}
