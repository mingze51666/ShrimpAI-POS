$prefix: order
title: 点餐
btn: 点餐
tutorial:
  title: 开始点餐！
  content: |
    一旦设定好菜单，就可以开始点餐啰
    让我们赶紧进去看看有什么吧！
  printerBtn:
    title: 出单机异动
    content: 出单机状态出现异动，请查看。
snackbar:
  printer:
    connected: 出单机连线成功：{names}
    disconnected: 出单机「{name}」断线
  cashier:
    notEnough: 收银机钱不够找啰！
    usingSmallMoney: 收银机使用小钱去找零
    usingSmallMoneyHelper: |-
      找钱给顾客时，收银机无法使用最适合的钱，就会显示这个讯息。

      例如，售价「65」，消费者支付「100」，此时应找「35」
      如果收银机只有两个十元，且有三个以上的五元，就会显示本讯息。

      怎么避免本提示：
      • 到换钱页面把各币值补足。
      • 到[设定页]({link})关闭收银机的相关提示。
action:
  checkout: 结帐
  exchange: 换钱
  stash: 暂存本次点餐
  review: 订单记录
loader:
  meta:
    totalRevenue: 总营收：{revenue}
    totalCost: 总成本：{cost}
    totalCount: 总数：{count}
  empty: 查无点餐纪录
catalogList:
  empty: 尚未设定产品种类
productList:
  view:
    helper:
    - grid: 图片
      list: 列表
  noIngredient: 无设定成分
printer:
  empty: 尚未设定出单机
  divider:
    unused: 未使用
    connecting: 连线中
    connected: 已连线
  error:
    createReceipt: 无法产生出单资料
cart:
  action:
    bulk: 批量操作
    toggle: 反选
    selectAll: 全选
    discount: 打折
    _discount:
      $prefix: discount
      label: 折扣
      hint: 例如：50，代表打五折（半价）
      helper: 这里的数字代表「折」，即，85 代表 85 折，总价乘 0.85。若需要准确的价钱请用「变价」。
      suffix: 折
    changePrice: 变价
    _changePrice:
      $prefix: changePrice
      label: 价钱
      hint: 每项产品的价钱
      prefix: ''
      suffix: 元
    changeCount: 变更数量
    _changeCount:
      $prefix: changeCount
      label: 数量
      hint: 产品数量
      suffix: 个
    free: 招待
    delete: 删除
  snapshot:
    empty: 尚未点餐
  meta:
    totalPrice: 总价：{price}
    totalCount: 总数：{count}
  product:
    price:
    - '0': 免费
      other: '{price}元'
    increase: 数量加一
    defaultQuantity: 预设份量
    ingredient: "{name}（{quantity}）"
  ingredient:
    status:
    - emptyCart: 请选择产品来设定其成分
      differentProducts: 请选择相同的产品来设定其成分
      noNeedIngredient: 这个产品没有可以设定的成分
  quantity:
    notAble: 请选择成分来设定份量
    label: '{name}（{amount}）'
    defaultLabel: 预设值（{amount}）
